name: Windows

# Builds and tests the Windows app (windows/). The macOS app is not affected.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore Meetco.Windows.slnx

      - name: Build
        run: dotnet build Meetco.Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Meetco.Core.Tests/Meetco.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  publish:
    needs: build-and-test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Publish single-file app
        run: >
          dotnet publish src/Meetco.App/Meetco.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Meetco-${{ matrix.rid }}
          path: windows/publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
