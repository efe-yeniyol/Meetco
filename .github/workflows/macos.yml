name: macOS

# Builds and tests the macOS app (macos/). The Windows app is not affected.
on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test
        run: make -C macos test

      - name: Build
        env:
          MEETCO_SIGN_IDENTITY: "-"
        run: make -C macos build
